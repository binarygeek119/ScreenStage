name: Delete Docker Hub repositories
on:
  workflow_dispatch:

jobs:
  delete-hub-repos:
    name: Delete Docker Hub repositories
    runs-on: ubuntu-latest
    steps:
      - name: Delete binarygeek119/posterrx and binarygeek119/screenstage
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          set -euo pipefail
          LOGIN=$(curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKER_USERNAME}\",\"password\":\"${DOCKER_HUB_TOKEN}\"}" \
            https://hub.docker.com/v2/users/login/)
          TOKEN=$(printf '%s' "$LOGIN" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token") or "")')
          if [ -z "$TOKEN" ]; then
            echo "Docker Hub login failed"
            printf '%s\n' "$LOGIN"
            exit 1
          fi
          for repo in posterrx screenstage; do
            echo "Deleting binarygeek119/${repo} ..."
            CODE=$(curl -sS -o /tmp/hub-del.out -w "%{http_code}" -X DELETE \
              -H "Authorization: JWT ${TOKEN}" \
              "https://hub.docker.com/v2/repositories/binarygeek119/${repo}/")
            echo "HTTP ${CODE}"
            cat /tmp/hub-del.out || true
            echo
            if [ "$CODE" != "202" ] && [ "$CODE" != "204" ] && [ "$CODE" != "404" ]; then
              echo "Unexpected status deleting ${repo}"
              exit 1
            fi
          done
